# ─────────────────────────────────────────────────────────────
# [tcm] — Taxpayer Cohort Model settings
#
# snapshot_N    : the horizon year at which TCM is evaluated, equal to the
#                 LRR breakeven year from the SSM for the active scenario.
#                 Update this after each SSM run if the breakeven year changes.
#                 (This is the only value that requires manual update between runs.)
# hist_mean     : historical mean return used as the tier differential baseline
#                 (fraction); derived from the returns series above = 10.45% p.a.
# ─────────────────────────────────────────────────────────────
[tcm]
snapshot_N          = 29     # LRR breakeven year for 2007 Balanced scenario
hist_mean           = 0.1045 # 10.45% p.a. — population-weighted mean of the returns series
scenario_start_year = 2007   # Calendar year at which the active scenario begins.
                              # load_params() rotates the canonical returns series so that
                              # this year sits at index 0, matching the Excel "WDT Year 0"
                              # convention. The sweep re-rotates independently per year.


# ─────────────────────────────────────────────────────────────
# [[tiers]] — growth tier definitions (array of tables)
#
# Each tier represents a persistent return differential relative to hist_mean.
# Source: Fagereng, Guiso, Malacrino and Pistaferri (2020).
# weight       : population share of active taxpayers assigned to this tier
# differential : additive return differential vs hist_mean (fraction)
#
# Constraint: sum of weights must equal 1.0
# Constraint: population-weighted mean of differentials must equal 0.0
#             (so weighted-average return recovers hist_mean)
# ─────────────────────────────────────────────────────────────
[[tiers]]
label        = "Poor"
weight       = 0.10
differential = -0.0455   # −4.55pp below mean → ~5.90% real return

[[tiers]]
label        = "Ok"
weight       = 0.30
differential = -0.0205   # −2.05pp below mean → ~8.40% real return

[[tiers]]
label        = "Good"
weight       = 0.40
differential =  0.0095   # +0.95pp above mean → ~11.40% real return

[[tiers]]
label        = "Great"
weight       = 0.20
differential =  0.0345   # +3.45pp above mean → ~13.90% real return


