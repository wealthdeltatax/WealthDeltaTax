k_v0_surface_v0 = [5.0, 10.0, 20.0, 50.0, 100.0, 200.0, 500.0]

# ── VAL.A Appendix C table grids ─────────────────────────────
appc_k_vals   = [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.05, 0.1]
