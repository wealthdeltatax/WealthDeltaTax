# ─────────────────────────────────────────────────────────────
# [val] — VAL reference scenario parameters
#
# These are used by the VAL output scripts (3.4.1–3.4.4) only.
# They are not RATES model inputs.
#
# V0_m : reference scenario entry wealth (£m). A round number
#         chosen for illustration across VAL, VAL.A, and VAL.B.
#         Not a bracket mean; not a population figure.
# ─────────────────────────────────────────────────────────────
[val]
V0_m = 20.0     # £20m — VAL reference entry wealth
rho = 0.05      # 5% default assuption


# ─────────────────────────────────────────────────────────────
# [sweep] — shared analytical grids and canonical reference values
#
# All hardcoded constants in VAL.S and RATES.S scripts are sourced
# from here.  Scripts read these via p['sweep'] after load_params().
#
# CANONICAL BASELINE
# ------------------
# These are the reference parameter values used as the "held-constant"
# point in all single-parameter sweeps, and as the make_p() defaults
# in VAL.S scripts.
#
# tau_0_canon  : canonical floor rate (τ₀)  — updated to 15%
# tau_m_canon  : canonical ceiling rate (τ_m)
# k_canon      : canonical steepness (per £m)
# W_min_canon  : canonical entry point (£m)
# N_canon      : canonical holding period (years) — LRR fill year at 2006 start
# V0_canon     : canonical entry wealth for VAL reference scenarios (£m)
# g_canon      : canonical growth rate = hist_mean (fraction)
#
# ANALYSIS CONSTANTS
# ------------------
# tzone_threshold : |C.1| below this is "negligible" for tolerant-zone analysis
#
# SHARED ANALYTICAL GRIDS (VAL and VAL.S)
# ----------------------------------------
# g_vals         : growth sweep used in C.1 heatmaps (VAL.A Data Tables order)
# alpha_vals     : declaration-ratio rows for heatmaps and comparison tables
# over_alphas    : overstater subset used in N-crossing analysis
# under_alphas   : understater subset used in penalty analysis
# n_sweep        : full N sweep range for crossing detection [min, max, step]
#                  scripts reconstruct: list(range(n_sweep[0], n_sweep[1]+1, n_sweep[2]))
# n_panel_vals   : N values used in 4-panel horizon figures
# n_actual_vals  : N values for Tables C.7/C.8 (actual simulation N, not Excel offset)
# v0_sweep_vals  : V₀ levels for VAL.S horizon/wealth sweeps
#
# VAL.S PARAMETER SWEEP PANELS
# -----------------------------
# tau0_panel_vals  : τ₀ values for 4-panel VAL.S figures (§2.1)
# taum_panel_vals  : τ_m values for 4-panel VAL.S figures (§2.2)
# k_panel_vals     : k values for 4-panel VAL.S figures (§2.3)
# wmin_panel_vals  : W_min values for 4-panel VAL.S figures (§2.4)
#
# VAL.S INTERACTION SURFACE GRIDS
# --------------------------------
# tau0_n_surface_tau0  : τ₀ axis for the §4.1 joint surface (fraction)
#                        encoded as [start_pct, stop_pct, step_pct] → /100
# tau0_n_surface_nceil : N-ceiling axis for §4.1 surface [min, max, step]
# k_v0_surface_k       : k axis for §4.2 surface
# k_v0_surface_v0      : V₀ axis for §4.2 surface (£m)
#
# VAL.A APPENDIX C TABLE GRIDS (appc_full, generate_figures)
# -----------------------------------------------------------
# appc_k_vals    : k values for Table C.4 (9 values, wider range than panels)
# appc_v0_vals   : V₀ values for Table C.4 (£m, integer)
# appc_over_vals : α values for Table C.3 overstatement extension
#
# RATES.S SWEEP GRIDS
# -------------------
# rates_tau_0_sweep  : τ₀ sweep for RATES.S single-parameter sensitivity
# rates_tau_m_sweep  : τ_m sweep
# rates_k_sweep      : k sweep (log-spaced)
# rates_wmin_sweep   : W_min sweep (£m)
# ─────────────────────────────────────────────────────────────
[sweep]

# ── Canonical baseline ────────────────────────────────────────
tau_0_canon = 0.15     # 15% — canonical floor rate
tau_m_canon = 0.70     # 70% — canonical ceiling rate
k_canon     = 0.001    # steepness per £m
W_min_canon = 2.0      # £2m — entry point
N_canon     = 29       # canonical holding period (LRR fill year, 2007 start)
V0_canon    = 20.0     # £20m — VAL reference entry wealth
g_canon     = 0.1045   # 10.45% p.a. — hist_mean alias

# ── Analysis constants ────────────────────────────────────────
tzone_threshold = 0.02   # 2pp — |C.1| threshold for tolerant-zone analysis

# ── Shared analytical grids ───────────────────────────────────
g_vals = [
  -0.0455, 0.00449, 0.059, 0.084, 0.1045,
   0.114,  0.139,   0.1645, 0.2045, 0.2545,
]
alpha_vals   = [0.1, 0.2, 0.5, 0.8, 1.0, 1.2, 1.5, 1.8, 2.0]
over_alphas  = [1.5, 1.8, 2.0]
under_alphas = [0.1, 0.2, 0.5, 0.8]

# n_sweep: [min, max, step] — scripts do list(range(min, max+1, step))
n_sweep = [5, 65, 1]

# n_panel_vals: 4 N values for horizon panel figures (§3.1b)
n_panel_vals  = [10, 20, 29, 50]

# n_actual_vals: Tables C.7/C.8 — actual simulation N (Excel offset corrected)
n_actual_vals = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]

# v0_sweep_vals: VAL.S §3.2 wealth-level sweep
v0_sweep_vals = [5.0, 20.0, 100.0, 500.0, 1000, 5000, 10000, 50000]

# ── VAL.S parameter sweep panels ─────────────────────────────
tau0_panel_vals = [0.10, 0.15, 0.20, 0.30, 0.40, 0.50]
taum_panel_vals = [0.50, 0.60, 0.70, 0.80]
k_panel_vals    = [0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.05, 0.1]
wmin_panel_vals = [0.5, 1.0, 2.0, 5.0, 10.0, 50]

# ── VAL.S interaction surface grids ──────────────────────────
# tau0_n_surface_tau0: [start_pct, stop_pct, step_pct] — divide by 100 for fraction
