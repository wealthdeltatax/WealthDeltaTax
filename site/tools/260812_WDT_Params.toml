# WDT Rates and Revenue — Parameters File
# =========================================
# This file is the single source of truth for all model inputs.
# The Excel workbook (7_1_260726_Rates_Analysis.xlsx) is now treated as a
# frozen checker only; Python reads nothing from it at runtime except for
# validation comparisons.
#
# TOML type rules relied on here:
#   integers  : no quotes, no decimal point   (e.g. 1947)
#   floats    : no quotes, must have decimal  (e.g. 0.001)
#   strings   : double-quoted
#   arrays    : [[double-bracket section headers]] for array-of-tables


# ─────────────────────────────────────────────────────────────
# [meta] — run identity
# ─────────────────────────────────────────────────────────────
[meta]
version        = "v7"
date           = "2026-08-15"
scenario_label = "2007 Balanced"   # human-readable label for outputs
excel_checker  = "7.1_260725_Rates_Analysis.xlsx"   # frozen; for validation only

[output]
generate_charts = true

# ─────────────────────────────────────────────────────────────
# [rate] — WDT logistic rate function parameters
#
# tau(W) = tau_m / (1 + ((tau_m - tau_0) / tau_0) * exp(-k * (W - W_min)))
#        = 0  if W < W_min
#
# tau_0  : floor rate at W = W_min (fraction, e.g. 0.15 = 15%)
# tau_m  : asymptotic ceiling rate (fraction, e.g. 0.70 = 70%)
# k      : steepness parameter (per £m); controls how fast rates rise
# W_min  : wealth level at which the rate function begins to apply (£m)
#           — a rate design parameter, not a population boundary
# ─────────────────────────────────────────────────────────────
[rate]
tau_0 = 0.15   # Balanced scenario floor rate
tau_m = 0.70    # ceiling rate (held constant across all scenarios)
k     = 0.001   # Balanced scenario steepness (per £m)
W_min = 2.0     # Balanced scenario entry point (£m)


# ─────────────────────────────────────────────────────────────
# [swf] — Sovereign Wealth Fund sizing parameters
#
# srr_ratio  : SRR target = srr_ratio × (cumulative net income / N)
#              Working value 3×; recommended Governing Council floor 3×
# lrr_years  : LRR floor expressed as N years of prevailing government
#              expenditure; recommended minimum 3 years
# ─────────────────────────────────────────────────────────────
[swf]
srr_ratio = 3.0   # SRR capitalisation ratio (× average net annual income)
lrr_years = 3.0   # LRR floor (years of government expenditure)


# ─────────────────────────────────────────────────────────────
# [budget] — UK government expenditure model
#
# budget_base   : OBR total managed expenditure base year (£b)
#                 Source: OBR 2022–23 outturn = £1,157.4b
# budget_growth : nominal expenditure growth rate per annum (fraction)
#                 Source: UK historical public expenditure 1999–2019 = 4.51%
# ─────────────────────────────────────────────────────────────
[budget]
budget_base   = 1157.4   # £b (2022–23 OBR total managed expenditure)
budget_growth = 0.0451   # 4.51% p.a. nominal growth


# ─────────────────────────────────────────────────────────────
