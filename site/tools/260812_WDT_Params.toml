rates_wmin_sweep     = [0.1, 0.25, 0.5, 1.0, 2.0, 3.0, 5.0, 7.5, 10.0]

# SWF sizing sweeps — vary capitalisation parameters, not rate parameters.
# Individual taxpayer burden is unaffected by these; only milestone timing changes.
# Baseline: srr_ratio = 3.0x,  lrr_years = 3.0 years of expenditure.
