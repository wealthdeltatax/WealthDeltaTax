# ── RATES.S sweep grids ───────────────────────────────────────
rates_tau_0_sweep    = [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]
rates_tau_m_sweep    = [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
