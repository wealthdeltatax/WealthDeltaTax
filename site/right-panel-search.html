<!-- WDT right-panel search widget -->
<!-- Injected via format.html.include-after-body in _quarto.yml -->
<!-- Mounts itself into #quarto-margin-sidebar when the right margin column exists. -->

<div id="wdt-search-panel" style="display:none">
  <div class="wdt-search-header">Search</div>

  <div class="wdt-search-input-wrap">
    <input
      id="wdt-search-input"
      type="search"
      placeholder="Search all papers…"
      autocomplete="off"
      spellcheck="false"
      aria-label="Search all papers"
    />
  </div>

  <div id="wdt-search-results"
       role="listbox"
       aria-label="Search results"></div>

  <div id="wdt-search-status"
       class="wdt-search-status"
       aria-live="polite"></div>
</div>

<script>
(function () {
  "use strict";

  // ── Configuration ────────────────────────────────────────────────────────
  // This is generated by pipeline/pages/site_index.py.
  var INDEX_URL = "/site-index.json";

  var MIN_CHARS = 2;
  var MAX_RESULTS = 12;
  var DEBOUNCE_MS = 180;

  // ── State ────────────────────────────────────────────────────────────────
  var searchRecords = null;
  var loadError = false;
  var debounceTimer = null;
  var lastQuery = "";

  // ── DOM refs ─────────────────────────────────────────────────────────────
  var panel, input, results, status;

  // ── Mount ────────────────────────────────────────────────────────────────
  function mount() {
    var sidebar = document.getElementById("quarto-margin-sidebar");
    if (!sidebar) return;

    panel = document.getElementById("wdt-search-panel");
    if (!panel) return;

    input = document.getElementById("wdt-search-input");
    results = document.getElementById("wdt-search-results");
    status = document.getElementById("wdt-search-status");

    if (!input || !results || !status) return;

    // The margin sidebar may contain Quarto-generated content on some pages.
    // This widget is intended to own the otherwise-empty right column.
    sidebar.innerHTML = "";
    sidebar.appendChild(panel);
    panel.style.display = "block";

    loadIndex();

    input.addEventListener("input", onInput);
    input.addEventListener("keydown", onKeydown);
  }

  // ── Index loading ───────────────────────────────────────────────────────
  function loadIndex() {
    fetch(INDEX_URL, {
      credentials: "same-origin",
      cache: "default"
    })
      .then(function (response) {
        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }
        return response.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.search)) {
          throw new Error("Invalid WDT search index");
        }

        searchRecords = data.search;

        if (input && input.value.trim().length >= MIN_CHARS) {
          runSearch(input.value.trim());
        }
      })
      .catch(function (error) {
        loadError = true;
        console.error("WDT search index:", error);

        if (status) {
          status.textContent = "Search index unavailable.";
        }
      });
  }

  // ── Input ────────────────────────────────────────────────────────────────
  function onInput() {
    clearTimeout(debounceTimer);

    var q = input.value.trim();

    if (q.length < MIN_CHARS) {
      clearResults();
      status.textContent = q.length > 0 ? "Keep typing…" : "";
      lastQuery = "";
      return;
    }

    if (q === lastQuery) return;

    debounceTimer = setTimeout(function () {
      runSearch(q);
    }, DEBOUNCE_MS);
  }

  // ── Keyboard navigation ─────────────────────────────────────────────────
  function onKeydown(e) {
    var items = results.querySelectorAll(".wdt-result-item");
    if (!items.length) return;

    var active = results.querySelector(".wdt-result-item.is-active");
    var idx = active
      ? Array.prototype.indexOf.call(items, active)
      : -1;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      setActive(items, idx < items.length - 1 ? idx + 1 : 0);

    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setActive(items, idx > 0 ? idx - 1 : items.length - 1);

    } else if (e.key === "Enter") {
      if (active) {
        e.preventDefault();
        window.location.href = active.getAttribute("data-href");
      }

    } else if (e.key === "Escape") {
      clearResults();
      input.value = "";
      status.textContent = "";
      lastQuery = "";
    }
  }

  function setActive(items, nextIdx) {
    Array.prototype.forEach.call(items, function (el) {
      el.classList.remove("is-active");
    });

    items[nextIdx].classList.add("is-active");
    items[nextIdx].scrollIntoView({ block: "nearest" });
  }

  // ── Search ───────────────────────────────────────────────────────────────
  function runSearch(q) {
    lastQuery = q;

    if (loadError) {
      status.textContent = "Search index unavailable.";
      return;
    }

    if (!searchRecords) {
      status.textContent = "Loading index…";
      return;
    }

    var terms = normaliseQuery(q);
    if (!terms.length) {
      clearResults();
      return;
    }

    var scored = [];

    for (var i = 0; i < searchRecords.length; i++) {
      var record = searchRecords[i];

      var title = String(record.title || "");
      var section = String(record.section || "");
      var text = String(record.text || "");
      var shortcode = String(record.shortcode || "");

      var titleL = title.toLowerCase();
      var sectionL = section.toLowerCase();
      var textL = text.toLowerCase();
      var shortcodeL = shortcode.toLowerCase();

      var score = 0;
      var allMatch = true;
      var matchedBodyTerm = false;

      for (var t = 0; t < terms.length; t++) {
        var term = terms[t];

        var inTitle = titleL.indexOf(term) !== -1;
        var inSection = sectionL.indexOf(term) !== -1;
        var inText = textL.indexOf(term) !== -1;
        var inShortcode = shortcodeL === term;

        if (!inTitle && !inSection && !inText && !inShortcode) {
          allMatch = false;
          break;
        }

        // Ranking:
        // exact paper shortcode > title > section heading > body.
        if (inShortcode) score += 20;
        if (inTitle) score += 10;
        if (inSection) score += 6;
        if (inText) {
          score += 1;
          matchedBodyTerm = true;
        }

        // Reward a term occurring more than once in body, but cap the effect.
        if (inText) {
          var occurrences = countOccurrences(textL, term, 20);
          score += Math.min(occurrences, 5) * 0.25;
        }
      }

      if (allMatch && score > 0) {
        scored.push({
          record: record,
          score: score,
          bodyMatch: matchedBodyTerm
        });
      }
    }

    scored.sort(function (a, b) {
      if (b.score !== a.score) {
        return b.score - a.score;
      }

      // Prefer section-level results over generic paper results where scores tie.
      if (a.record.kind !== b.record.kind) {
        return a.record.kind === "section" ? -1 : 1;
      }

      return String(a.record.section || a.record.title)
        .localeCompare(String(b.record.section || b.record.title));
    });

    var hits = scored.slice(0, MAX_RESULTS);

    clearResults();

    if (!hits.length) {
      status.textContent = 'No results for "' + q + '".';
      return;
    }

    status.textContent = "";

    var frag = document.createDocumentFragment();

    for (var h = 0; h < hits.length; h++) {
      var hit = hits[h].record;
      var href = hit.href || "#";

      var displayTitle = hit.kind === "section"
        ? (hit.shortcode ? hit.shortcode + " — " + hit.section : hit.section)
        : hit.title;

      var snippet = "";

      if (hit.kind === "section" && hit.text) {
        snippet = makeSnippet(hit.text, terms, 120);
      } else if (hit.kind === "paper") {
        snippet = hit.title;
      }

      var item = document.createElement("a");
      item.className = "wdt-result-item";
      item.setAttribute("href", addQueryParameter(href, q));
      item.setAttribute("data-href", addQueryParameter(href, q));
      item.setAttribute("role", "option");

      var titleEl = document.createElement("div");
      titleEl.className = "wdt-result-title";
      titleEl.innerHTML = highlightTerms(
        escHtml(displayTitle),
        terms
      );

      item.appendChild(titleEl);

      if (snippet) {
        var snippetEl = document.createElement("div");
        snippetEl.className = "wdt-result-snippet";
        snippetEl.innerHTML = highlightTerms(
          escHtml(snippet),
          terms
        );
        item.appendChild(snippetEl);
      }

      frag.appendChild(item);
    }

    results.appendChild(frag);
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function normaliseQuery(q) {
    return q
      .toLowerCase()
      .replace(/[“”"]/g, "")
      .split(/\s+/)
      .map(function (term) {
        return term.trim();
      })
      .filter(Boolean);
  }

  function countOccurrences(text, term, max) {
    var count = 0;
    var start = 0;

    while (count < max) {
      var pos = text.indexOf(term, start);
      if (pos === -1) break;
      count++;
      start = pos + Math.max(term.length, 1);
    }

    return count;
  }

  function makeSnippet(text, terms, maxLength) {
    var clean = String(text).replace(/\s+/g, " ").trim();

    if (clean.length <= maxLength) {
      return clean;
    }

    var lower = clean.toLowerCase();
    var bestPos = -1;

    for (var i = 0; i < terms.length; i++) {
      var pos = lower.indexOf(terms[i]);
      if (pos !== -1 && (bestPos === -1 || pos < bestPos)) {
        bestPos = pos;
      }
    }

    var start = 0;

    if (bestPos > 40) {
      start = Math.max(0, bestPos - 45);
    }

    var snippet = clean.slice(start, start + maxLength);

    if (start > 0) snippet = "…" + snippet;
    if (start + maxLength < clean.length) snippet += "…";

    return snippet;
  }

  function addQueryParameter(href, query) {
    if (!href || href === "#") return href;

    var hashIndex = href.indexOf("#");
    var base = hashIndex === -1 ? href : href.slice(0, hashIndex);
    var hash = hashIndex === -1 ? "" : href.slice(hashIndex);

    var separator = base.indexOf("?") === -1 ? "?" : "&";
    return base + separator + "q=" + encodeURIComponent(query) + hash;
  }

  function clearResults() {
    if (results) results.innerHTML = "";
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function highlightTerms(html, terms) {
    var out = html;

    for (var i = 0; i < terms.length; i++) {
      var t = terms[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      if (!t) continue;

      out = out.replace(
        new RegExp("(" + t + ")", "gi"),
        "<mark>$1</mark>"
      );
    }

    return out;
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }
}());
</script>
