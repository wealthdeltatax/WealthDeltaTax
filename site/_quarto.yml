website:
  title: "Wealth Delta Tax (WDT)"
  description: "The Wealth Delta Tax (WDT) taxes changes in individual net wealth on an accrual basis, with symmetric loss refunds and a pre-funded Sovereign Wealth Fund — a proposed alternative to conventional wealth taxation."
  site-url: "https://wealthdeltatax.org"

  open-graph:
    title: "Wealth Delta Tax (WDT)"
    description: "The Wealth Delta Tax (WDT) taxes changes in individual net wealth on an accrual basis, with symmetric loss refunds and a pre-funded Sovereign Wealth Fund."
