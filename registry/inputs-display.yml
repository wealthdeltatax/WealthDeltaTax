# registry/inputs-display.yml: display spec per register row (brief 032r, hooks Q8).
# Written by the research lane; merged by pipeline/build_inputs.py. One entry per row of
# docs/model-v3/inputs.md (279 rows). Derived only from each row's own unit text and the
# precision of its Low/Central/High cells. No value is chosen or changed here.
#
# unit tags in docs/model-v3/outputs.yml: pct, pct_per_year, pct_gdp, gbp_bn, years, pp, ratio, bp, count, gbp_month.
# PROPOSED new tags (not in outputs.yml; guru to accept, rename or map to existing ones):
#   pp_per_year  percentage points a year
#   usd_bn       US$ billions
#   gbp          pounds (per household a year, a year, per person, per hour; the display_unit says which)
#   gbp_m        £ millions
#   gbp_k        £ thousands
#   coefficient  dimensionless coefficient or elasticity, shown as a plain decimal
#   correlation  correlation, plain decimal
#   text         not a single quantity; resolver should refuse {{i:}} display for these rows
# scale is 1 on every row: each value is already stored in the unit its display_unit names.
# decimals = most decimal places among the row's numeric Low/Central/High cells.
# note appears only where the unit is ambiguous or the row has no numeric cells.
