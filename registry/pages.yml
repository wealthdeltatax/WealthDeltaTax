# Page registry: one row per page (brief 029s; docs/restructure/site/ids.md rule 7, site.md section 2).
#
# Fields: id, type, title, url, source, status, parent, aliases, label, order.
#   type    hub | spoke | appendix | standalone | legacy | pending | calculator | site
#   status  draft | author-review | accepted | legacy
#   url     the live URL (root-relative). Drafts publish under /draft/<id>.html and are not built yet.
#   title and status are NOT set on spoke or appendix rows: they come from the page's own front matter
#   (site.md R4); a spoke row that sets either is a validation error.
#   order/label  menu position (1 to 15) and text, menu spokes only.
# A url (or alias) claimed by two rows is reported by `config.find_url_collisions`; the live row
# is built and the draft row is held, never published over it (site.md Q1).
# Legacy row ids are `old-<url stem>` because the new series reuses the codes VAL, CORP, GOV, POL
# and BEHAV; ids are permanent (ids.md rule 1), so the new pages take the bare codes.
# Standalone rows (ADD, INST, SCOPE) keep their URL; their text moves to the spoke shape after the data gate (site.md Q8).
# registry/papers.yml stays the legacy source for the 33 papers until cutover; a test keeps the two in step.

