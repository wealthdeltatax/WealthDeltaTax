# Model v3: output manifest (brief 011g, stage A passed 2026-11-16, A2 passed; added outputs integrated 2026-11-17)
# One entry per output. Papers cite the id. An output with no whitepaper element does not exist (R1).
# element: hub sections (H0 to H7) and the spoke shortcodes of docs/restructure/shortcodes.md (FAIR, LIT, MECH, VAL, DECL, FISC, PAY, BEHAV, WELF, FUND, CORP, ATTR, GOV, POL, FIRST, WIDER, UNCER, LIMIT, FALS, and the split pages ADOPT, PILOT, HYPO) that cite the output; filled in brief 013g stage B, proposed until the author approves the stage.
# summary: how the output is reported. p10_mean_p90 = sampled range (R5).
version: "stage-A7-units-2026-11-18"
country_pack: UK
horizons: [transition, short, long]   # every headline and line is reported for all three; long is a steady-state property, not a forecast
schedules: [S_low, S_central, S_high]   # named policy schedules, swept not sampled; headline outputs are reported for each (metrics.md, range design)
uncertainty: {level1: return_risk_p10_mean_p90, level2: tornado_and_parameter_p10_p90}   # reported apart
unit_tags:   # how a hook renders a value (hooks.md section 4.6; the three added tags are to be added there)
  pct: "number then %"
  pct_per_year: "number then % per year"
  pct_gdp: "number then % of GDP"
  gbp_bn: "£ number bn"
  years: "number then years"
  pp: "number then percentage points"
  ratio: "number alone"
  bp: "number then basis points"          # added 2026-11-17
  count: "number with thousands separators"   # added 2026-11-17
  gbp_month: "£ number a month"          # added 2026-11-17
# unit and decimals are one value, or a map from line id (for outputs with several lines). horizons: omitted means all three; [single] means no horizon dimension.
# by: a map from dimension to its allowed values (hooks.md Q3, accepted). series: true means an annual series exists for figures.
outputs:
  - {id: O1,   metric: M1,  title: "Government revenue, net fiscal effect",       summary: p10_mean_p90, lines: [M1a, M1b, M1c, M1d], unit: pct_gdp, decimals: 2, element: [H0, H3, FISC, POL, HYPO], kind: headline}
  - {id: O1a,  metric: M1a, title: "Individual WDT net of refunds",               summary: p10_mean_p90, unit: pct_gdp, decimals: 2, element: [H3, FISC], kind: line}
  - {id: O1b,  metric: M1b, title: "Corporate levy (own line)",                   summary: p10_mean_p90, unit: pct_gdp, decimals: 2, element: [H3, FISC, CORP, UNCER], kind: line}
  - {id: O1c,  metric: M1c, title: "Fund income net of retention",                summary: p10_mean_p90, unit: pct_gdp, decimals: 2, element: [FISC, FUND], kind: line}
  - {id: O1d,  metric: M1e, title: "Receipts of retired taxes, one line per tax", summary: p10_mean_p90, by: {per: [corporation_tax, council_tax, business_rates, capital_gains_tax, inheritance_tax, stamp_duties_property, stamp_taxes_shares]}, unit: pct_gdp, decimals: 2, element: [FISC, FUND, UNCER], kind: line}
  - {id: O2,   metric: M2,  title: "Taxpayer burden, share of wealth",            summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10]}, unit: pct_per_year, decimals: 2, element: [H0, H3, FISC, PAY, FALS], kind: headline}
  - {id: O3,   metric: M3,  title: "Taxpayer burden, gain-weighted lifetime rate", summary: p10_mean_p90, unit: pct, decimals: 2, horizons: [single], element: [H3, FISC, PAY], kind: headline}
  - {id: O4a,  metric: M4a, title: "Non-payer savings, share of tax bill",        summary: p10_mean_p90, by: {income_decile: [overall, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]}, unit: pct, decimals: 1, element: [H0, H3, PAY, FUND, FIRST, HYPO], kind: headline}
  - {id: O4b,  metric: M4b, title: "Non-payer savings, share of income",          summary: p10_mean_p90, by: {income_decile: [overall, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]}, unit: pct, decimals: 1, element: [H3, PAY, FUND, FIRST], kind: headline}
  - {id: O5,   metric: M5,  title: "Burden against suggested wealth taxes",       summary: p10_mean_p90, unit: pct, decimals: 2, element: [FISC, PAY, FALS], kind: comparison}
  - {id: O6,   metric: M6,  title: "Burden against today's income tax, CGT and IHT", summary: p10_mean_p90, unit: pct, decimals: 2, element: [FISC, PAY, FALS], kind: comparison}
  - {id: O7,   metric: M7,  title: "Tolerant zone (C.1 over TW(1))",              summary: point_and_range, unit: pp, decimals: 1, horizons: [single], element: [H5, DECL, FISC], kind: supporting}
  - {id: OP1,  metric: P1,  title: "Reserve fill years",                          summary: p10_mean_p90, unit: years, decimals: 1, horizons: [single], element: [FISC, FUND, POL], kind: path}
  - {id: OP4,  metric: P4,  title: "Sustainability: long-term over short-term revenue, and first year below zero", summary: p10_mean_p90, unit: ratio, decimals: 2, horizons: [single], element: [FISC, FUND], kind: path}
  - {id: OP5,  metric: P5,  title: "Year each retired tax is retired",           summary: p10_mean_p90, unit: years, decimals: 1, horizons: [single], element: [FUND, POL], kind: path}
  - {id: OP3,  metric: P3,  title: "Cumulative shortfall (proof of staged retirement)", summary: p10_mean_p90, unit: pct_gdp, decimals: 2, horizons: [single], element: [FUND, POL], kind: path}
  - {id: O2b,  metric: M2b, title: "Taxpayer cash-flow burden, share of income",     summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10], cutoff_pct_of_income: [5, 10, 20]}, unit: pct, decimals: 1, element: [PAY], kind: headline_support}
  - {id: O2c,  metric: M2c, title: "Taxpayer cash-flow burden, share of liquid assets", summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10], cutoff_pct_of_liquid_assets: [25, 50, 100]}, unit: pct, decimals: 1, element: [PAY], kind: headline_support}
  - {id: O8,   metric: M8,  title: "Reform-in-place benchmark (same revenue, same people)", summary: p10_mean_p90, unit: pct, decimals: 2, horizons: [short], element: [H5, FISC], kind: comparison}
  - {id: OS1,  metric: S1,  title: "Capitalisation of retired property taxes (on against off)", summary: point_and_range, by: {quantity: [m1, m2, payer_count]}, unit: pp, decimals: 2, horizons: [single], element: [H5, WIDER], kind: sensitivity}
  - {id: OP6,  metric: P6,  title: "Public wealth path (fund assets, % of GDP at years 10, 25, 50, 100)", summary: p10_mean_p90, by: {year: [10, 25, 50, 100]}, unit: pct_gdp, decimals: 1, horizons: [single], series: true, element: [FUND, HYPO], kind: path}
  # ---- added 2026-11-17 (briefs 014g to 016g; definitions in metrics.md "Added metrics"). OH1a (concentration path) dropped by the author on 2026-11-17: it rested on returns rising with wealth rank, which has no UK evidence (022r) ----
  - {id: OH1b, metric: M3, system: today, title: "Lifetime rate on gains under today's taxes (M3-today and M3-all-tax) for payers", summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10]}, comparator: OH1b2, once_not_per_schedule: true, unit: pct, decimals: 1, horizons: [single], element: [H1], kind: problem}
  - {id: OH1b2, metric: M11, title: "Median worker's average income tax and NICs rate", summary: point, unit: pct, decimals: 1, horizons: [single], element: [H1], kind: problem}
  - {id: OH1c, metric: M12, title: "Share of lifetime gains that escape tax today, by cause", summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10], cause: [deferral_uplift, exempt_by_law]}, once_not_per_schedule: true, unit: pct, decimals: 1, horizons: [single], element: [H1], kind: problem}
  - {id: DH1a, title: "UK wealth shares and wealth to GDP, now and over time", summary: point_and_range, unit: pct, decimals: 1, element: [H1], kind: data_fact}
  - {id: DH1b, title: "UK tax mix by head and by group", summary: point, unit: pct_gdp, decimals: 1, element: [H1], kind: data_fact}
  - {id: DH1c, title: "Tax bill of non-payers by income decile", summary: point_and_range, by: {income_decile: [overall, D1, D2, D3, D4, D5, D6, D7, D8, D9, D10]}, unit: pct, decimals: 1, element: [H1, PAY], kind: data_fact}
  - {id: OW1,  metric: M13, title: "Certainty-equivalent welfare of the tax systems at equal revenue (WDT, income tax and CGT, stock wealth tax, consumption tax)", summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10], tax_system: [wdt, income_tax_cgt, stock_wealth_tax, consumption_tax]}, unit: bp, decimals: 0, horizons: [single], element: [WELF, HYPO], kind: comparison}
  - {id: OW2,  metric: M14, title: "CGT lock-in welfare cost", summary: p10_mean_p90, by: [embedded_gain_band, holding_period], unit: bp, decimals: 0, horizons: [single], element: [WELF], kind: comparison}
  - {id: OW3,  metric: M15a, title: "Contribution envelope binding", summary: p10_mean_p90, by: {wealth_band: [overall, D4_5, D6_7, D8_9, D10], entry_year: [value_per_cohort]}, lines: [M15a, M15b], unit: {M15a: pct, M15b: pct_gdp}, decimals: {M15a: 1, M15b: 2}, element: [WELF], kind: path}
  - {id: OB1,  metric: B1,  title: "Payers, entries, exits and fall-through refund volume, by threshold", summary: p10_mean_p90, by: [w_min], lines: [B1a, B1b, B1c, B1d], unit: {B1a: pct, B1b: pct_per_year, B1c: pct_per_year, B1d: pct_gdp}, decimals: {B1a: 1, B1b: 1, B1c: 1, B1d: 2}, element: [MECH, FISC, UNCER], kind: supporting}
  - {id: OR1,  metric: P7,  title: "Reserve solvency: share of paths where the long reserve reaches zero, and minimum cover", summary: point_and_range, lines: [P7a, P7b], unit: {P7a: pct, P7b: ratio}, decimals: {P7a: 1, P7b: 2}, horizons: [short, long], element: [FISC, POL], kind: path}
  - {id: OD1,  metric: M7,  title: "Declaration curve across alpha (C.1 over TW(1), refund protection lost, modal declaration)", summary: point_and_range, by: [alpha_grid], lines: [M7c, M7d, M7e], unit: {M7c: pp, M7d: pp, M7e: ratio}, decimals: {M7c: 1, M7d: 1, M7e: 2}, horizons: [single], element: [H5, DECL], kind: supporting}
  - {id: OM1,  metric: M9,  title: "Net fiscal effect after migration (M1 less income tax, NICs and VAT lost from leavers)", summary: p10_mean_p90, lines: [M1, X], unit: {M1: pct_gdp, X: pct_gdp}, decimals: {M1: 2, X: 2}, element: [BEHAV], kind: headline_support}
  - {id: OL1,  metric: M4c, title: "Non-payer saving in pounds per month for a reference worker (view of O4b)", summary: p10_mean_p90, by: [reference_worker], unit: gbp_month, decimals: 0, element: [PAY, FUND], kind: headline_support}
  - {id: OF1,  metric: F1,  title: "Feasibility map over the schedule family (closure share, M2 and M4a at each point)", summary: p10_mean_p90, by: [schedule_grid, w_min], lines: [F1, M2, M4a], unit: {F1: pct, M2: pct_per_year, M4a: pct}, decimals: {F1: 0, M2: 2, M4a: 1}, horizons: [transition, short], element: [FISC], kind: supporting}
  - {id: OT1,  metric: T1,  title: "Tornado: one input at a time, low and high, on M1, M2, M4a and M3", summary: point_and_range, by: [input, headline, schedule], unit: pp, decimals: 2, element: [FISC], kind: supporting}
checks:   # tests of the model, cited as evidence; no range, so not outputs
  - {id: CK1, metric: [P1, P3, P7b], title: "Synthetic cyclical stress test (fixed sinusoidal return path, by amplitude)", summary: point_and_range, by: [amplitude], unit: {P1: years, P3: pct_gdp, P7b: ratio}, decimals: {P1: 1, P3: 2, P7b: 2}, horizons: [short], element: [FALS], kind: check}
