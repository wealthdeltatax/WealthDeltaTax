# Model v3: output manifest (brief 011g, stage A passed 2026-11-16, A2 passed; added outputs integrated 2026-11-17)
# One entry per output. Papers cite the id. An output with no whitepaper element does not exist (R1).
# element: hub sections (H0 to H7), spokes (S1 to S12) and appendix spokes (S4-A, S6-A, S6-B, S8-A) that cite the output; filled in brief 013g stage B, proposed until the author approves the stage.
# summary: how the output is reported. p10_mean_p90 = sampled range (R5).
version: stage-A3-integrated-2026-11-17
country_pack: UK
horizons: [transition, short, long]   # every headline and line is reported for all three; long is a steady-state property, not a forecast
schedules: [S_low, S_central, S_high]   # named policy schedules, swept not sampled; headline outputs are reported for each (metrics.md, range design)
uncertainty: {level1: return_risk_p10_mean_p90, level2: tornado_and_parameter_p10_p90}   # reported apart
outputs:
  - {id: O1,   metric: M1,  title: "Government revenue, net fiscal effect",       summary: p10_mean_p90, lines: [M1a, M1b, M1c, M1d], element: [H0, H3, S5, S10, S12], kind: headline}
  - {id: O1a,  metric: M1a, title: "Individual WDT net of refunds",               summary: p10_mean_p90, element: [H3, S5], kind: line}
  - {id: O1b,  metric: M1b, title: "Corporate levy (own line)",                   summary: p10_mean_p90, element: [H3, S5, S8, S12], kind: line}
  - {id: O1c,  metric: M1c, title: "Fund income net of retention",                summary: p10_mean_p90, element: [S5, S7], kind: line}
  - {id: O1d,  metric: M1e, title: "Receipts of retired taxes, one line per tax", summary: p10_mean_p90, element: [S5, S7, S12], kind: line, per: [corporation_tax, council_tax, business_rates, capital_gains_tax, inheritance_tax, stamp_duties_property, stamp_taxes_shares]}
  - {id: O2,   metric: M2,  title: "Taxpayer burden, share of wealth",            summary: p10_mean_p90, by: [overall, wealth_band], element: [H0, H3, S5, S6, S12], kind: headline}
  - {id: O3,   metric: M3,  title: "Taxpayer burden, gain-weighted lifetime rate", summary: p10_mean_p90, element: [H3, S5, S6], kind: headline}
  - {id: O4a,  metric: M4a, title: "Non-payer savings, share of tax bill",        summary: p10_mean_p90, by: [overall, income_decile], element: [H0, H3, S6, S7, S11, S12], kind: headline}
  - {id: O4b,  metric: M4b, title: "Non-payer savings, share of income",          summary: p10_mean_p90, by: [overall, income_decile], element: [H3, S6, S7, S11], kind: headline}
  - {id: O5,   metric: M5,  title: "Burden against suggested wealth taxes",       summary: p10_mean_p90, element: [S5, S6, S12], kind: comparison}
  - {id: O6,   metric: M6,  title: "Burden against today's income tax, CGT and IHT", summary: p10_mean_p90, element: [S5, S6, S12], kind: comparison}
  - {id: O7,   metric: M7,  title: "Tolerant zone (C.1 over TW(1))",              summary: point_and_range, element: [H5, S4-A, S5], kind: supporting}
  - {id: OP1,  metric: P1,  title: "Reserve fill years",                          summary: p10_mean_p90, element: [S5, S7, S10], kind: path}
  - {id: OP4,  metric: P4,  title: "Sustainability: long-term over short-term revenue, and first year below zero", summary: p10_mean_p90, element: [S5, S7], kind: path}
  - {id: OP5,  metric: P5,  title: "Year each retired tax is retired",           summary: p10_mean_p90, element: [S7, S10], kind: path}
  - {id: OP3,  metric: P3,  title: "Cumulative shortfall (proof of staged retirement)", summary: p10_mean_p90, element: [S7, S10], kind: path}
  - {id: O2b,  metric: M2b, title: "Taxpayer cash-flow burden, share of income",     summary: p10_mean_p90, by: [wealth_band, share_of_payers_above_cutoff], element: [S6], kind: headline_support}
  - {id: O2c,  metric: M2c, title: "Taxpayer cash-flow burden, share of liquid assets", summary: p10_mean_p90, by: [wealth_band, share_of_payers_above_cutoff], element: [S6], kind: headline_support}
  - {id: O8,   metric: M8,  title: "Reform-in-place benchmark (same revenue, same people)", summary: p10_mean_p90, element: [H5, S5], kind: comparison}
  - {id: OS1,  metric: S1,  title: "Capitalisation of retired property taxes (on against off)", summary: point_and_range, element: [H5, S11], kind: sensitivity}
  - {id: OP6,  metric: P6,  title: "Public wealth path (fund assets, % of GDP at years 10, 25, 50, 100)", summary: p10_mean_p90, element: [S7, S12], kind: path}
  # ---- added 2026-11-17 (briefs 014g to 016g; definitions in metrics.md "Added metrics") ----
  - {id: OH1a, metric: M10, title: "Concentration path: top 1% and 10% share with and without the WDT", summary: p10_mean_p90, by: [q_1pct_10pct, year_10_25_50, scenario_s0_s1], element: [H1, S6], kind: problem, premise: returns_rise_with_wealth_rank}
  - {id: OH1b, metric: M3, system: today, title: "Lifetime rate on gains under today's taxes (M3-today and M3-all-tax) for payers", summary: p10_mean_p90, by: [overall, wealth_band], comparator: OH1b2, once_not_per_schedule: true, element: [H1], kind: problem}
  - {id: OH1b2, metric: M11, title: "Median worker's average income tax and NICs rate", summary: point, element: [H1], kind: problem}
  - {id: OH1c, metric: M12, title: "Share of lifetime gains that escape tax today, by cause", summary: p10_mean_p90, by: [wealth_band, cause_deferral_uplift_exempt], once_not_per_schedule: true, element: [H1], kind: problem}
  - {id: DH1a, title: "UK wealth shares and wealth to GDP, now and over time", summary: point_and_range, element: [H1], kind: data_fact}
  - {id: DH1b, title: "UK tax mix by head and by group", summary: point, element: [H1], kind: data_fact}
  - {id: DH1c, title: "Tax bill of non-payers by income decile", summary: point_and_range, by: [income_decile], element: [H1, S6], kind: data_fact}
  - {id: OW1,  metric: M13, title: "Certainty-equivalent welfare of the tax systems at equal revenue (WDT, income tax and CGT, stock wealth tax, consumption tax)", summary: p10_mean_p90, by: [overall, wealth_band, tax_system], element: [S6-B, S12], kind: comparison}
  - {id: OW2,  metric: M14, title: "CGT lock-in welfare cost", summary: p10_mean_p90, by: [embedded_gain_band, holding_period], element: [S6-B], kind: comparison}
  - {id: OW3,  metric: M15a, title: "Contribution envelope binding", summary: p10_mean_p90, by: [return_tier, entry_year], lines: [M15a, M15b], element: [S6-B, S12], kind: path}
  - {id: OB1,  metric: B1,  title: "Payers, entries, exits and fall-through refund volume, by threshold", summary: p10_mean_p90, by: [w_min], lines: [B1a, B1b, B1c, B1d], element: [S3, S5, S12], kind: supporting}
  - {id: OR1,  metric: P7,  title: "Reserve solvency: share of paths where the long reserve reaches zero, and minimum cover", summary: point_and_range, lines: [P7a, P7b], element: [S5, S10], kind: path}
  - {id: OD1,  metric: M7,  title: "Declaration curve across alpha (C.1 over TW(1), refund protection lost, modal declaration)", summary: point_and_range, by: [alpha_grid], lines: [M7c, M7d, M7e], element: [H5, S4-A], kind: supporting}
  - {id: OM1,  metric: M9,  title: "Net fiscal effect after migration (M1 less income tax, NICs and VAT lost from leavers)", summary: p10_mean_p90, lines: [M1, X], element: [S6-A], kind: headline_support}
  - {id: OL1,  metric: M4c, title: "Non-payer saving in pounds per month for a reference worker (view of O4b)", summary: p10_mean_p90, by: [reference_worker], element: [S6, S7], kind: headline_support}
  - {id: OF1,  metric: F1,  title: "Feasibility map over the schedule family (closure share, M2 and M4a at each point)", summary: p10_mean_p90, by: [schedule_grid, w_min], lines: [F1, M2, M4a], element: [S5], kind: supporting}
  - {id: OT1,  metric: T1,  title: "Tornado: one input at a time, low and high, on M1, M2, M4a and M3", summary: point_and_range, by: [input, headline, schedule], element: [S5], kind: supporting}
checks:   # tests of the model, cited as evidence; no range, so not outputs
  - {id: CK1, metric: [P1, P3, P7b], title: "Synthetic cyclical stress test (fixed sinusoidal return path, by amplitude)", summary: point_and_range, by: [amplitude], element: [S12], kind: check}
