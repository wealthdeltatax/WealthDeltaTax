<div class="wdt-print-header" aria-hidden="true"><span class="wdt-print-header__title" data-slot="print-title"></span><span class="wdt-print-header__draft" data-slot="print-draft"></span></div>
<div class="wdt-print-footer" aria-hidden="true"><span class="wdt-print-footer__url" data-slot="print-url"></span><span class="wdt-print-footer__run" data-run-date></span><span class="wdt-print-footer__manifest" data-manifest-version></span></div>
<script>
(function () {
  function text(el) { return el ? el.textContent.replace(/\s+/g, " ").trim() : ""; }
  function fill() {
    var t = document.querySelector("h1.title") || document.querySelector("h1");
    var title = document.querySelector("[data-slot='print-title']");
    var draft = document.querySelector("[data-slot='print-draft']");
    var url = document.querySelector("[data-slot='print-url']");
    var banner = document.querySelector(".wdt-banner--draft");
    if (title) { title.textContent = text(t) || document.title; }
    if (draft) { draft.textContent = banner ? text(banner) : ""; }
    if (url) { url.textContent = window.location.href.split("#")[0]; }
  }
  var opened = [];
  function openAll() {
    fill();
    opened = [];
    document.querySelectorAll("details").forEach(function (d) {
      if (!d.open) { d.open = true; opened.push(d); }
    });
  }
  function restore() {
    opened.forEach(function (d) { d.open = false; });
    opened = [];
  }
  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", fill); } else { fill(); }
  window.addEventListener("beforeprint", openAll);
  window.addEventListener("afterprint", restore);
})();
</script>
