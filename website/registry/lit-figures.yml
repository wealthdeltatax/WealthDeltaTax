# website/registry/lit-figures.yml: published figures the papers quote, keyed <bibkey>:<slug> (briefs 032r, 043r; hooks Q9).
# Research lane owns it. Every entry was re-read in the held copy named in source_file on the verified date; quoted_as is
# the figure as printed (a range printed once is entered as two entries, one per end). Held copies and the register rows they
# serve are mapped in docs/model-v3/source-map.md; discrepancies with the register are in its section 3.
#
# page = page of the held PDF (the 'page N' a PDF viewer shows). printed = the page number printed on that page, where it differs
# and was checked (PDF page + offset: AdvaniBanghamLeslie2021 +395, AdvaniTarrant2021 +508, KosterPinchbeck2018 -2, BesleyEtAl2014 -1,
# BestKleven2018 +156, TippetZucman2026 -1, AdvaniHughsonSummers2023 +404). AdamEtAl2025 is chapter 4 of the Green Budget; chapter page = PDF page - 122.
# Workbook figures give table, row and column instead of a page. A figure converted to the entry's unit says so in note.
#
# Coverage: the figures the register rows use from the 14 literature files held in literature/ (S4, S5, S6, S13, S16, S17, S18,
# S22, S23, S24, S25, S30, S37; S38 holds no register figure, see source-map section 3). Not held, so not entered: S3, S7-S9,
# S11, S12, S14, S15, S19-S21, S26-S29, S31-S36, S39-S43. No figure from memory. Ledger rows quote no published figure in the
# text (ledger-sections.md), so none was added from the ledger.
#
# MISSING bib keys (proposed, not in registry/references.bib; the author reworks the reference list later, 043r decision).
