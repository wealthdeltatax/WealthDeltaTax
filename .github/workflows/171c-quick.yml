name: 171c quick comparison
# 171c: quick size on both numerics paths with the new code, and on the old code (main at 49c2bfd) on the forced path. Runs on a push to this brief branch.
on:
  push:
    branches: ['brief/171-zero-tolerance']
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: new_off, ref: '', npy: 'X86_V4'}
          - {name: new_avx, ref: '', npy: ''}
          - {name: old_off, ref: '49c2bfd', npy: 'X86_V4'}
    env:
      NPY_DISABLE_CPU_FEATURES: ${{ matrix.npy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install numpy==2.5.3 pyyaml==6.0.3 pytest==9.1.1 openpyxl==3.1.5 bibtexparser==1.4.3
      - run: lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-200; grep -c avx512f /proc/cpuinfo || true
      - name: quick run
        run: python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(['--size', 'quick', '--out', 'out_${{ matrix.name }}'])"
      - run: sha256sum out_${{ matrix.name }}/outputs.json
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out_${{ matrix.name }}/outputs.json
  compare:
    needs: quick
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - run: |
          sha256sum art/*/outputs.json
          echo "== new_off vs new_avx (must be identical for O1f, O2b, O2c)"
          python -I results/171c-zero-tolerance/compare_outputs.py art/new_off/outputs.json art/new_avx/outputs.json
          echo "== old_off (the old pins' path) vs new_off: the movement"
          python -I results/171c-zero-tolerance/compare_outputs.py art/old_off/outputs.json art/new_off/outputs.json
          echo "== all outputs, old_off vs new_off"
          python -I results/171c-zero-tolerance/compare_outputs.py art/old_off/outputs.json art/new_off/outputs.json --all
