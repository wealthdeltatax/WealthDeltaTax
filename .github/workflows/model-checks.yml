name: Model checks

# 168c. The fast job runs on every push to main, on pull requests and by hand. The long jobs run only by hand
# (Actions tab, "Model checks", "Run workflow"). No job passes --final: the run script refuses it, and no input exists for it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Run the smoke tests (about 30 min)'
        type: boolean
        default: false
      run_converge:
        description: 'Run the convergence tests (about 1.5 h on a hosted runner)'
        type: boolean
        default: false
      run_accept:
        description: 'Run accept.sh whole: suites, convergence, two quick runs, validation, compare (about 5 h)'
        type: boolean
        default: true
      run_speed:
        description: 'Run the speed job: quick against its time budget, bench small cases (about 15 min)'
        type: boolean
        default: false
      run_final_size:
        description: 'Run the final-size grid split over five jobs (hours; never passes --final)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  # The one numerics path (169c, 170c): numpy's AVX512 exp, log and pow differ from the AVX2 ones, so every job forces the AVX2 path.
  NPY_DISABLE_CPU_FEATURES: 'X86_V4'
  # Pinned to the versions the suites and the tripwire were measured with.
  PIP_PINS: 'numpy==2.5.3 pyyaml==6.0.3 pytest==9.1.1 openpyxl==3.1.5 bibtexparser==1.4.3'

jobs:
  fast:
    name: fast (suites, checks, tripwire)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: model-checks-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 'Checkout (full history, which the tripwire and the pack builder read)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pdftotext -v 2>&1 | head -n 1
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: 'Numerics path (informational: the digest fixtures hold only on the AVX512 path of numpy)'
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, numpy as np
          x = np.abs(np.random.default_rng(7).standard_normal(100000)) + 0.5
          h = lambda a: hashlib.sha256(a.tobytes()).hexdigest()[:16]
          got = (h(np.exp(x)), h(np.log(x)), h(x ** 1.7))
          print('avx512f in /proc/cpuinfo:', 'avx512f' in open('/proc/cpuinfo').read())
          print('exp, log, pow hashes:', got)
          print('AVX512 path (the fixtures):', got == ('0915e809eb9f7187', '655f3ea1be57d472', '88a3c4863ed8d314'))
          PY

      - name: Suites, one pytest per suite
        run: |
          set -u
          fail=0
          # tests/website/layout is left out: it needs Quarto and a Playwright browser (the site build), and it skips without them in the baseline too.
          for s in tests/model/data tests/model/gate tests/model/tools tests/project \
                   tests/website/cards tests/website/glossary tests/website/hooks \
                   tests/website/nav tests/website/pages tests/website/retired; do
            echo "::group::$s"
            echo "+ python -m pytest $s -q"
            # test_real_repository_is_closed_today runs the real acceptance command (check_gate G1: hours now that accept.sh step 1 passes): left to the accept job, see the 170c report
            python -m pytest "$s" -q -p no:cacheprovider --deselect tests/model/gate/test_gate.py::test_real_repository_is_closed_today || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Model suite, without convergence and smoke
        run: |
          echo '+ python -m pytest tests/model/model_v3 -q -m "not converge and not split" --ignore=tests/model/model_v3/test_smoke.py'
          python -m pytest tests/model/model_v3 -q -m "not converge and not split" --ignore=tests/model/model_v3/test_smoke.py -p no:cacheprovider

      - name: Agent documents
        run: |
          echo '+ python -I project/tools/check_agent_docs.py'
          python -I project/tools/check_agent_docs.py

      - name: 'Lane plan and agent table (generated from the brief headers; run build_lane_plan.py if red)'
        run: |
          echo '+ python -I project/tools/build_lane_plan.py --check'
          python -I project/tools/build_lane_plan.py --check

      - name: Tripwire
        run: |
          echo '+ python -I project/restructure/move_tripwire.py'
          python -I project/restructure/move_tripwire.py

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  smoke:
    name: 'smoke (tests/model/model_v3/test_smoke.py)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: model-checks-smoke
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Smoke tests
        run: |
          echo '+ python -m pytest tests/model/model_v3/test_smoke.py -q'
          python -m pytest tests/model/model_v3/test_smoke.py -q -p no:cacheprovider --junitxml=smoke-junit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-junit.xml

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  converge:
    name: 'converge (tests/model/model_v3/test_converge.py -m converge)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_converge }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: model-checks-converge
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Convergence tests
        run: |
          echo '+ python -m pytest tests/model/model_v3/test_converge.py -q -m converge'
          python -m pytest tests/model/model_v3/test_converge.py -q -m converge -p no:cacheprovider --junitxml=converge-junit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converge-results
          path: converge-junit.xml

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  speed:
    # 177c. A slowdown is a failed check. Only the wall time of `quick` gates; the bench numbers are informational. On pushes to main it runs
    # only when the push touched model/. Never passes --final.
    name: 'speed (quick against its budget, bench small cases)'
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_speed) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Seconds, hosted 4-core runner (brief 177c): the slowest of three runs (EPYC 7763, 1335 s) plus 25%; the median rule alone (975 s plus 25%, 1219 s) would fail that CPU family. Ledger: results/speedup/ledger.md.
      QUICK_BUDGET_S: '1670'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did model/ change?
        id: touch
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^model/'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "no change under model/: nothing to time"; fi
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Python
        if: steps.touch.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the machine
        if: steps.touch.outputs.run == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install $PIP_PINS
          git rev-parse HEAD
          echo "nproc $(nproc)"; free -g | sed -n 2p; lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "CPU_LINE=$(lscpu | sed -n 's/^Model name: *//p')" >> "$GITHUB_ENV"
          W=$(python -I -c "import os; m = int(next(l for l in open('/proc/meminfo') if l.startswith('MemTotal')).split()[1]) // 2**20; print(max(1, min(os.cpu_count() or 1, (m - 2) // 3)))")
          echo "W=$W" >> "$GITHUB_ENV"

      - name: Bench small cases (informational)
        if: steps.touch.outputs.run == 'true'
        run: |
          echo "+ python -I model/studies/run-cost/bench.py run --out bench-small.json --workers $W"
          python -I model/studies/run-cost/bench.py run --out bench-small.json --workers "$W"

      - name: 'quick, timed against QUICK_BUDGET_S'
        if: steps.touch.outputs.run == 'true'
        run: |
          mkdir -p quick-out
          T0=$(date +%s)
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(['--size', 'quick', '--out', 'quick-out', '--workers', '$W'])"
          T=$(( $(date +%s) - T0 ))
          echo "quick wall time $T s, budget $QUICK_BUDGET_S s, workers $W, CPU: $CPU_LINE"
          echo "QUICK_S=$T" >> "$GITHUB_ENV"
          if [ "$T" -gt "$QUICK_BUDGET_S" ]; then
            echo "::error::quick took $T s, over the budget of $QUICK_BUDGET_S s (workers $W, CPU: $CPU_LINE)"
            exit 1
          fi

      - name: Upload timings
        if: always() && steps.touch.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: speed-results
          path: |
            bench-small.json
            quick-out/outputs.json

  accept:
    name: 'accept (accept.sh, whole)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_accept }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: model-checks-accept
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: 'accept.sh, whole (steps 1 to 7; about 5 hours: smoke and fast suites, convergence, two quick runs)'
        env:
          TMPDIR: ${{ github.workspace }}/acceptance
          ACCEPT_KEEP: '1'    # accept.sh keeps its two temporary run folders so the next step can upload them
        run: |
          mkdir -p "$TMPDIR"
          echo '+ bash tests/model/model_v3/accept.sh'
          bash tests/model/model_v3/accept.sh

      - name: Upload both output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-outputs
          path: acceptance/**/outputs.json

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"
