name: Model checks

# 168c. The fast job runs on every push to main, on pull requests and by hand. The long jobs run only by hand
# (Actions tab, "Model checks", "Run workflow"). No job passes --final: the run script refuses it, and no input exists for it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_smoke:
        description: 'Run the smoke tests (about 30 min)'
        type: boolean
        default: false
      run_converge:
        description: 'Run the convergence tests (about 1.5 h on a hosted runner)'
        type: boolean
        default: false
      run_accept:
        description: 'Run accept.sh whole: suites, convergence, two quick runs, validation, compare (about 5 h)'
        type: boolean
        default: true
      run_speed:
        description: 'Run the speed job: quick against its time budget, bench small cases (about 15 min)'
        type: boolean
        default: false
      run_noise:
        description: 'Measure the C1 seed noise (model/tools/c1_noise.py, 10 seeds at 10,000 paths; about 1 h) and upload the report'
        type: boolean
        default: false
      run_final_size:
        description: 'Run the split run at final size: plan, one job per grid point, O1e in batches of 25 draws, merge (hours; 32 jobs; never passes --final)'
        type: boolean
        default: false
      run_split_quick:
        description: 'Run the split run at quick size and the unsplit quick run, then compare the two files byte for byte (183c; about 1 h)'
        type: boolean
        default: false
      run_split_proof:
        description: 'Run the split-equals-unsplit proof at smoke size on one runner (tests/model/model_v3/test_split_proof.py; about 1 h)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.13'
  # The one numerics path (169c, 170c): numpy's AVX512 exp, log and pow differ from the AVX2 ones, so every job forces the AVX2 path.
  NPY_DISABLE_CPU_FEATURES: 'X86_V4'
  # Pinned to the versions the suites and the tripwire were measured with.
  PIP_PINS: 'numpy==2.5.3 pyyaml==6.0.3 pytest==9.1.1 openpyxl==3.1.5 bibtexparser==1.4.3'

jobs:
  fast:
    name: fast (suites, checks, tripwire)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: model-checks-fast-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: 'Checkout (full history, which the tripwire and the pack builder read)'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pdftotext -v 2>&1 | head -n 1
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: 'Numerics path (informational: the digest fixtures hold only on the AVX512 path of numpy)'
        continue-on-error: true
        run: |
          python - <<'PY'
          import hashlib, numpy as np
          x = np.abs(np.random.default_rng(7).standard_normal(100000)) + 0.5
          h = lambda a: hashlib.sha256(a.tobytes()).hexdigest()[:16]
          got = (h(np.exp(x)), h(np.log(x)), h(x ** 1.7))
          print('avx512f in /proc/cpuinfo:', 'avx512f' in open('/proc/cpuinfo').read())
          print('exp, log, pow hashes:', got)
          print('AVX512 path (the fixtures):', got == ('0915e809eb9f7187', '655f3ea1be57d472', '88a3c4863ed8d314'))
          PY

      - name: Suites, one pytest per suite
        run: |
          set -u
          fail=0
          # tests/website/layout is left out: it needs Quarto and a Playwright browser (the site build), and it skips without them in the baseline too.
          for s in tests/model/data tests/model/gate tests/model/tools tests/project \
                   tests/website/cards tests/website/glossary tests/website/hooks \
                   tests/website/nav tests/website/pages tests/website/retired; do
            echo "::group::$s"
            echo "+ python -m pytest $s -q"
            # test_real_repository_is_closed_today runs the real acceptance command (check_gate G1: hours now that accept.sh step 1 passes): left to the accept job, see the 170c report
            python -m pytest "$s" -q -p no:cacheprovider --deselect tests/model/gate/test_gate.py::test_real_repository_is_closed_today || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Model suite, without convergence and smoke
        run: |
          echo '+ python -m pytest tests/model/model_v3 -q -m "not converge and not split" --ignore=tests/model/model_v3/test_smoke.py'
          python -m pytest tests/model/model_v3 -q -m "not converge and not split" --ignore=tests/model/model_v3/test_smoke.py -p no:cacheprovider

      - name: Agent documents
        run: |
          echo '+ python -I project/tools/check_agent_docs.py'
          python -I project/tools/check_agent_docs.py

      - name: 'Lane plan and agent table (generated from the brief headers; run build_lane_plan.py if red)'
        run: |
          echo '+ python -I project/tools/build_lane_plan.py --check'
          python -I project/tools/build_lane_plan.py --check

      - name: Tripwire
        run: |
          echo '+ python -I project/restructure/move_tripwire.py'
          python -I project/restructure/move_tripwire.py

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  smoke:
    name: 'smoke (tests/model/model_v3/test_smoke.py)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: model-checks-smoke
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Smoke tests
        run: |
          echo '+ python -m pytest tests/model/model_v3/test_smoke.py -q'
          python -m pytest tests/model/model_v3/test_smoke.py -q -p no:cacheprovider --junitxml=smoke-junit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-junit.xml

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  converge:
    name: 'converge (tests/model/model_v3/test_converge.py -m converge)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_converge }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: model-checks-converge
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Convergence tests
        run: |
          echo '+ python -m pytest tests/model/model_v3/test_converge.py -q -m converge'
          python -m pytest tests/model/model_v3/test_converge.py -q -m converge -p no:cacheprovider --junitxml=converge-junit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: converge-results
          path: converge-junit.xml

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  speed:
    # 177c. A slowdown is a failed check. Only the wall time of `quick` gates; the bench numbers are informational. On pushes to main it runs
    # only when the push touched model/. Never passes --final.
    name: 'speed (quick against its budget, bench small cases)'
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_speed) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Seconds, hosted 4-core runner (brief 177c): the slowest of three runs (EPYC 7763, 1335 s) plus 25%; the median rule alone (975 s plus 25%, 1219 s) would fail that CPU family. Ledger: results/speedup/ledger.md.
      QUICK_BUDGET_S: '1670'
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did model/ change?
        id: touch
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null | grep -q '^model/'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "no change under model/: nothing to time"; fi
          else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Python
        if: steps.touch.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the machine
        if: steps.touch.outputs.run == 'true'
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install $PIP_PINS
          git rev-parse HEAD
          echo "nproc $(nproc)"; free -g | sed -n 2p; lscpu | grep -E 'Model name|^CPU\(s\)'
          echo "CPU_LINE=$(lscpu | sed -n 's/^Model name: *//p')" >> "$GITHUB_ENV"
          W=$(python -I -c "import os; m = int(next(l for l in open('/proc/meminfo') if l.startswith('MemTotal')).split()[1]) // 2**20; print(max(1, min(os.cpu_count() or 1, (m - 2) // 3)))")
          echo "W=$W" >> "$GITHUB_ENV"

      - name: Bench small cases (informational)
        if: steps.touch.outputs.run == 'true'
        run: |
          echo "+ python -I model/studies/run-cost/bench.py run --out bench-small.json --workers $W"
          python -I model/studies/run-cost/bench.py run --out bench-small.json --workers "$W"

      - name: 'quick, timed against QUICK_BUDGET_S'
        if: steps.touch.outputs.run == 'true'
        run: |
          mkdir -p quick-out
          T0=$(date +%s)
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(['--size', 'quick', '--out', 'quick-out', '--workers', '$W'])"
          T=$(( $(date +%s) - T0 ))
          echo "quick wall time $T s, budget $QUICK_BUDGET_S s, workers $W, CPU: $CPU_LINE"
          echo "QUICK_S=$T" >> "$GITHUB_ENV"
          if [ "$T" -gt "$QUICK_BUDGET_S" ]; then
            echo "::error::quick took $T s, over the budget of $QUICK_BUDGET_S s (workers $W, CPU: $CPU_LINE)"
            exit 1
          fi

      - name: Upload timings
        if: always() && steps.touch.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: speed-results
          path: |
            bench-small.json
            quick-out/outputs.json

  noise:
    name: 'noise (model/tools/c1_noise.py, brief 187c)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_noise }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: model-checks-noise
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: C1 seed noise
        run: |
          echo '+ python model/tools/c1_noise.py run --out noise-out --workers 4 --write-limits noise-out/c1_limits.json --run-url <this run>'
          python model/tools/c1_noise.py run --out noise-out --workers 4 --write-limits noise-out/c1_limits.json --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1-noise-results
          path: |
            noise-out/c1-noise.csv
            noise-out/c1-noise.md
            noise-out/c1_limits.json
            noise-out/paths

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  accept:
    name: 'accept (accept.sh, whole)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_accept }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    concurrency:
      group: model-checks-accept
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils   # pdftotext, read by the pack builder
          pip install $PIP_PINS
          python --version
          pip list --format=freeze | grep -iE '^(numpy|pyyaml|pytest|openpyxl|bibtexparser)=='
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: 'accept.sh, whole (steps 1 to 7; about 5 hours: smoke and fast suites, convergence, two quick runs)'
        env:
          TMPDIR: ${{ github.workspace }}/acceptance
          ACCEPT_KEEP: '1'    # accept.sh keeps its two temporary run folders so the next step can upload them
        run: |
          mkdir -p "$TMPDIR"
          echo '+ bash tests/model/model_v3/accept.sh'
          bash tests/model/model_v3/accept.sh

      - name: Upload both output files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accept-outputs
          path: acceptance/**/outputs.json

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  # 183c. The split run: plan, one job per grid point, O1e in batches, merge. Design: results/split-run/design.md. Each unit job writes one partial file; `merge` reads them all and
  # writes the one outputs.json. The unsplit quick run and a `cmp` follow when run_split_quick is set. `--size final` is a size; the flag --final that the script refuses is not used.
  split-plan:
    name: 'split: plan (feasibility map, named schedules, the unit lists)'
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_final_size || inputs.run_split_quick) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      size: ${{ steps.plan.outputs.size }}
      date: ${{ steps.plan.outputs.date }}
      points: ${{ steps.plan.outputs.points }}
      o1e: ${{ steps.plan.outputs.o1e }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          pip install $PIP_PINS
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Plan
        id: plan
        run: |
          SIZE=${{ inputs.run_final_size && 'final' || 'quick' }}
          echo "+ python -I -c 'run.main' --size $SIZE --unit plan --workers 4 --out partials"
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(sys.argv[1:])" --size "$SIZE" --batch 25 --unit plan --workers 4 --out partials
          python -I - "$SIZE" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys; sys.path.insert(0, 'model')
          from model_v3 import numerics  # noqa: F401
          from model_v3.out import split as sp
          from pathlib import Path
          us = sp.expected(sp.loads(Path('partials/plan.json').read_bytes())['header'])[1:]
          print('size=' + sys.argv[1]); print('date=' + __import__('datetime').datetime.now(__import__('datetime').timezone.utc).date().isoformat())
          print('points=' + json.dumps([u for u in us if u.startswith('point:')])); print('o1e=' + json.dumps([u for u in us if u.startswith('o1e')]))
          PY

      - name: Upload the plan
        uses: actions/upload-artifact@v4
        with:
          name: partial-plan
          path: partials/plan*.json
          retention-days: 14
          overwrite: true

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  split-points:
    name: 'split: ${{ matrix.unit }}'
    needs: split-plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.split-plan.outputs.points) }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          pip install $PIP_PINS
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Get the plan
        uses: actions/download-artifact@v4
        with:
          name: partial-plan
          path: partials

      - name: Unit
        run: |
          echo "+ run.py --unit ${{ matrix.unit }}"
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(sys.argv[1:])" --size "${{ needs.split-plan.outputs.size }}" --batch 25 --unit "${{ matrix.unit }}" --plan-file partials/plan.json --workers 4 --out partials

      - name: Upload the partial
        if: always()
        run: |
          mkdir -p out; for f in partials/*; do case "$f" in */plan*.json) ;; *) cp "$f" out/ ;; esac; done
          echo "NAME=partial-$(echo '${{ matrix.unit }}' | tr ':' '_')" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/*.json
          retention-days: 14
          overwrite: true

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  split-o1e:
    name: 'split: ${{ matrix.unit }}'
    needs: split-plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.split-plan.outputs.o1e) }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          pip install $PIP_PINS
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Get the plan
        uses: actions/download-artifact@v4
        with:
          name: partial-plan
          path: partials

      - name: Unit
        run: |
          echo "+ run.py --unit ${{ matrix.unit }}"
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(sys.argv[1:])" --size "${{ needs.split-plan.outputs.size }}" --batch 25 --unit "${{ matrix.unit }}" --plan-file partials/plan.json --workers 4 --out partials

      - name: Upload the partial
        if: always()
        run: |
          mkdir -p out; for f in partials/*; do case "$f" in */plan*.json) ;; *) cp "$f" out/ ;; esac; done
          echo "NAME=partial-$(echo '${{ matrix.unit }}' | tr ':' '_')" >> "$GITHUB_ENV"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: out/*.json
          retention-days: 14
          overwrite: true

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  split-merge:
    name: 'split: merge'
    needs: [split-plan, split-points, split-o1e]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          pip install $PIP_PINS
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Get every partial
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          merge-multiple: true
          path: partials

      - name: Merge (refuses a mismatched header, a missing unit, a duplicate that differs)
        run: |
          ls partials
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(sys.argv[1:])" --size "${{ needs.split-plan.outputs.size }}" --batch 25 --merge partials --run-date "${{ needs.split-plan.outputs.date }}" --out merged

      - name: Upload the merged file
        uses: actions/upload-artifact@v4
        with:
          name: split-merged-outputs
          path: merged/outputs.json
          retention-days: 14
          overwrite: true

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  split-unsplit:
    name: 'split: the unsplit quick run, for the comparison'
    needs: split-plan
    if: ${{ inputs.run_split_quick && !inputs.run_final_size }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          pip install $PIP_PINS
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Unsplit quick run
        run: |
          python -I -c "import sys; sys.path.insert(0, 'model'); from model_v3 import run; run.main(sys.argv[1:])" --size quick --batch 25 --run-date "${{ needs.split-plan.outputs.date }}" --workers 4 --out unsplit

      - name: Upload the unsplit file
        uses: actions/upload-artifact@v4
        with:
          name: unsplit-outputs
          path: unsplit/outputs.json
          retention-days: 14

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"

  split-compare:
    name: 'split: merged equals unsplit (cmp)'
    needs: [split-merge, split-unsplit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: split-merged-outputs
          path: merged
      - uses: actions/download-artifact@v4
        with:
          name: unsplit-outputs
          path: unsplit
      - name: cmp
        run: |
          ls -l merged unsplit
          cmp merged/outputs.json unsplit/outputs.json && echo 'IDENTICAL: the merged file equals the unsplit file byte for byte'

  split-proof:
    name: 'split proof (test_split_proof.py, smoke size, one runner)'
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_split_proof }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: model-checks-split-proof
      cancel-in-progress: false
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pinned requirements, log the environment
        run: |
          echo "START=$(date +%s)" >> "$GITHUB_ENV"
          sudo apt-get install -y --no-install-recommends poppler-utils
          pip install $PIP_PINS
          git rev-parse HEAD
          lscpu | grep -E 'Model name|^CPU\(s\)'

      - name: Proof
        run: |
          echo '+ python -m pytest tests/model/model_v3/test_split_proof.py -q -m split'
          python -m pytest tests/model/model_v3/test_split_proof.py -q -m split -p no:cacheprovider --junitxml=split-proof-junit.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: split-proof-results
          path: split-proof-junit.xml

      - name: Wall time
        if: always()
        run: echo "wall time $(( $(date +%s) - START )) s"
