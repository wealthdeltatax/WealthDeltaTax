name: Deploy WDT site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: pip install pyyaml bibtexparser==1.4.3

      - name: Install Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /home/runner/.puppeteer.json
          echo "PUPPETEER_CONFIG=/home/runner/.puppeteer.json" >> $GITHUB_ENV

      - name: Scrape contents
        run: python website/build/scrape_contents.py --write

      - name: Build glossary
        run: |
          python website/build/build_glossary.py \
            --papers papers/legacy \
            --contents website/registry/contents.yml \
            --out website/site/pages/glossary.md

      - name: Build anchors
        run: python website/build/build_anchors.py

      - name: Preprocess
        run: python website/build/preprocess.py

      - name: Render Quarto site
        run: quarto render _build

      - name: Copy generated figures into site
        run: |
          # The legacy figures are gone from the tree (tag legacy-models-2026-11); copy only if a build step still produces some.
          if [ -d _build/figures ]; then cp -r _build/figures/. _build/_site/figures/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
