name: Deploy WDT site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Install bibtex dependencies
        run: pip install bibtexparser     

      - name: Scrape contents
        run: python pipeline/scrape_contents.py --write

      - name: Build glossary
        run: |
          python pipeline/build_glossary.py \
            --papers source \
            --contents registry/contents.yml \
            --out site/pages/glossary.md

      - name: Run build anchors
        run: python pipeline/build_anchors.py

      - name: Run preprocessing
        run: python pipeline/preprocess.py

      - name: Debug _build structure and generated _quarto.yml
        if: failure()
        run: |
          echo "=== _build file list ==="
          find _build -type f | sort | head -80

          echo ""
          echo "=== _quarto.yml content ==="
          cat _build/_quarto.yml || echo "  (_quarto.yml not found)"

          echo ""
          echo "=== Quarto version ==="
          quarto --version

      - name: Render Quarto site
        run: quarto render _build --verbose 2>&1

      - name: Copy tool runtime files to _site
        run: |
          mkdir -p _build/_site/tools
          cp _build/tools/wdt_core.py _build/_site/tools/ 2>/dev/null || true
          cp _build/tools/rates_model.py _build/_site/tools/ 2>/dev/null || true
          cp _build/tools/260812_WDT_Params.toml _build/_site/tools/ 2>/dev/null || true

      - name: Debug after render
        if: failure()
        run: |
          echo "=== _build/_site contents ==="
          find _build/_site -type f | sort | head -80 || echo "_build/_site does not exist"

      - name: Debug _build/tools structure
        run: |
          echo "=== _build/tools ==="
          find _build/tools -type f | sort
          echo "=== _build/_site/tools ==="
          find _build/_site/tools -type f | sort 2>/dev/null || echo "tools/ not in _site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_build/_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
